[package]
name = "vidcompare"
version = "0.1.0"
edition = "2021"
authors = ["VidCompare Team"]
description = "Video quality comparison tool - PSNR, VMAF, SSIM metrics"

[dependencies]
# === GUI Framework (egui) ===
eframe = "0.29"
egui = "0.29"
egui_plot = "0.29"

# === Async & Concurrency ===
tokio = { version = "1.42", features = ["full"] }
rayon = "1.10"

# === Database ===
rusqlite = { version = "0.32", features = ["bundled"] }

# === File & Path ===
walkdir = "2.5"
dirs = "5.0"

# === Serialization ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# === Logging ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# === CSV Export ===
csv = "1.3"

# === Date & Time ===
chrono = { version = "0.4", features = ["serde"] }

# === System ===
num_cpus = "1.16"

# === Error Handling ===
anyhow = "1.0"

# === File Dialog ===
rfd = "0.14"

# === HTTP Client ===
reqwest = { version = "0.12", features = ["blocking"] }

# === Archive extraction ===
tar = "0.4"
xz2 = "0.1"
zip = "2"

# === Windows Specific ===
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# === VMAF native Rust bindings ===
libvmaf-rs = { version = "0.5", default-features = false, features = ["libvmaf-static"] }
